[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astribot-robot-bridge"
version = "0.1.0"
description = "HTTP/WebSocket bridge for Astribot robot info, motion, and audio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "h5py>=3.10",
  "httpx>=0.27",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["bridge*"]
